name: CI & E2E Testing

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Start all services (Database, Backend, Frontend) via Docker Compose
      - name: Start Services with Docker Compose
        run: |
          docker compose up -d --build

      # 3. Run Cypress E2E Tests against the running app
      - name: Run Cypress E2E Tests
        uses: cypress-io/github-action@v6
        with:
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 120

      # 4. Clean up Docker containers when finished
      - name: Stop Docker Compose
        if: always()
        run: |
          docker compose down
